name: RentMineOnline
description: RentMineOnline was a San Francisco-based software-as-a-service company, founded in 2007,
  that brought resident referral programs online for the multifamily rental housing industry by leveraging
  leading social networking sites. Its platform sent community-branded emails to apartment residents and
  paid them referral bonuses for recommending their buildings to friends across their social networks. In
  2011 it was voted "Best New Company in Apartment Marketing." RentMineOnline was acquired by RealPage in
  July 2012 and folded into RealPage's multifamily marketing portfolio; it no longer operates an independent
  website or developer program. Surfaced as a portfolio company of Seedcamp and added to the API Evangelist
  network as a stub, this profile was processed by the enrichment pipeline, which confirmed no public API
  surface, developer documentation, or discovery artifacts exist for the defunct entity.
